name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', '.gitignore']
  workflow_dispatch:

# A newer push to the same branch makes the running build pointless; never cancel tag (release) builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write # release upload on tags

env:
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_PACKAGES: D:\nuget # D: is the runner's fast local disk

jobs:
  build:
    # The image already has the .NET 10 SDK (global.json) and Rust; Inno Setup 7 is installed below
    runs-on: windows-latest
    steps:
      # Submodule (dtsx-objects/DTSX_decoder) only fetched when its helper has to be rebuilt, see below
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          "VERSION=$v" >> $env:GITHUB_ENV
          "dtsx=$(git rev-parse HEAD:dtsx-objects/DTSX_decoder)" >> $env:GITHUB_OUTPUT # submodule commit, from the tree

      # thd-objects changes rarely and a cold build takes ~30 min on the runner (the truehd crate itself, not LTO),
      # so cache the finished exe by its sources instead of caching cargo state by compiler version
      - name: Cache thd-objects.exe
        id: thd
        uses: actions/cache@v6
        with:
          path: thd-objects/target/release/thd-objects.exe
          key: thd-objects-${{ hashFiles('thd-objects/Cargo.toml', 'thd-objects/Cargo.lock', 'thd-objects/build.rs', 'thd-objects/*.rc', 'thd-objects/src/**', 'icons/thd-objects.ico') }}

      - name: Build thd-objects (TrueHD helper)
        if: steps.thd.outputs.cache-hit != 'true'
        working-directory: thd-objects
        run: cargo build --release --locked

      # Same for the DTS helper (~2 min with CMake): key on its sources plus the submodule commit
      - name: Cache dtsx-objects.exe
        id: dtsxcache
        uses: actions/cache@v6
        with:
          path: dtsx-objects/build/Release/dtsx-objects.exe
          key: dtsx-objects-${{ steps.version.outputs.dtsx }}-${{ hashFiles('dtsx-objects/main.cpp', 'dtsx-objects/CMakeLists.txt', 'dtsx-objects/*.rc', 'icons/dtsx-objects.ico') }}

      - name: Build dtsx-objects (DTS helper)
        if: steps.dtsxcache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 dtsx-objects/DTSX_decoder
          cmake -S dtsx-objects -B dtsx-objects/build
          cmake --build dtsx-objects/build --config Release --parallel

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ hashFiles('AtmosBridge.csproj', 'global.json') }}

      - name: Publish AtmosBridge (self-contained, windowless)
        run: >
          dotnet publish AtmosBridge.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:OutputType=WinExe -p:Version=${{ env.VERSION }} -o publish

      - name: Self-test
        shell: pwsh
        run: |
          # WinExe: wait explicitly and read the log for the result
          $p = Start-Process publish/AtmosBridge.exe -ArgumentList '--selftest', '--log', 'selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
          if (-not (Test-Path publish/thd-objects.exe)) { throw 'thd-objects.exe missing from publish' }
          if (-not (Test-Path publish/dtsx-objects.exe)) { throw 'dtsx-objects.exe missing from publish' }
          publish/dtsx-objects.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "dtsx-objects selftest failed ($LASTEXITCODE)" }

      # Measured on windows-latest (70 MB payload): lzma2/fast 2 threads 4.6 s / 29 MB, lzma2/max 1 thread 24 s / 24.9 MB,
      # max 2 threads 18 s / 25 MB (4 threads no faster). Releases get the small file, every other build the fast one.
      # The image only has Inno Setup 6 (Chocolatey too): install the pinned 7 release, checked against its hash
      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe -OutFile $exe
          if ((Get-FileHash $exe).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw 'Inno Setup installer hash mismatch' }
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP\is7" -Wait

      - name: Build installer
        shell: pwsh
        run: |
          $comp = if ($env:GITHUB_REF -like 'refs/tags/v*') { 'lzma2/max' } else { 'lzma2/fast' }
          & "$env:RUNNER_TEMP\is7\ISCC.exe" /Qp "/DMyAppVersion=$env:VERSION" "/DCompression=$comp" installer/AtmosBridge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v7
        with:
          name: AtmosBridge-${{ env.VERSION }}-setup
          path: out/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.exe
          generate_release_notes: true
